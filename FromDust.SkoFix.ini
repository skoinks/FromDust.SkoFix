; From Dust SkoFix settings. Changes take effect the next time the game starts.
; Unless a comment says otherwise, 1 is on and 0 is off.

[Cutscenes]
; Keys that skip videos and cutscenes, separated by commas. Examples: SkipKeys=Space, Enter, F5
; Possible keys: A to Z, 0 to 9, F1 to F24, Space, Enter, Escape, Tab, Backspace, Shift, Ctrl, Alt,
; Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left, Right, Numpad0 to Numpad9,
; MouseMiddle, Mouse4, Mouse5
SkipKeys=Space, Enter
; Skip keys work on videos
SkipVideos=1
; Skip keys work on cutscenes made with the game's graphics. Those that the story depends on are
; played at high speed instead
SkipCinematics=1
; Skip the logos when the game starts, without pressing a key (needs SkipVideos=1)
SkipIntro=1
; Never play cutscenes made with the game's graphics
AutoSkipCinematics=0

[Graphics]
; Full screen as a window without a frame. Switching with Alt+Tab is instant
Borderless=1
; Trees, bushes, objects and villagers keep their best model at any distance
BestModels=1
; How far sun shadows reach. The game uses 200 to 300, a whole map is about 1100 across.
; 0 = original
ShadowDistance=1200
; Sharpness of sun shadows: 1 = original, 2 = double, 4 = four times
ShadowResolution=4
; Small and distant things cast shadows too
ShadowAllCasters=1
; Better water: smoother waves, finer ripples, reflections, sun glitter, crisper foam
ImprovedWater=1
; Speed of the shimmer on calm water: 1.0 = original, 0.5 = half
WaterShimmerSpeed=0.5

[Frame]
; Frames per second: 60, 30 (original speed, smoother) or 0 (the game's own limiter).
; Water and terrain always run at their original speed
TargetFps=60
; Work on water and terrain while waiting for the next frame. Makes the game smoother
DeferSimulation=1
; Keep effects at their original speed above 30 frames per second. Leave this on
RateFixes=1

[Mouse]
; Ordinary mouse pointer instead of the worm. Matter you carry is still shown
NormalCursor=1
; Size of that pointer, in pixels on a screen 1080 pixels high
NormalCursorSize=40
; The mouse moves the pointer across the screen, as on the desktop. 0 = across the ground
ScreenSpaceCursor=1
; Pointer speed and camera rotation speed, on top of the sensitivity in the game's options
CursorSpeed=1.0
CameraSpeed=1.0
; Hold this key to move the camera faster (None = off), and how much faster
FastPanKey=Ctrl
FastPanSpeed=2.0
; How far the camera zooms out: 1.0 = original, 1.5 = half as far again
ZoomOut=1.5
; Move the camera when the pointer is at the edge of the screen
EdgePan=1
; Push the pointer away from the edge while the camera moves, as in the original.
; Off needs ScreenSpaceCursor=1
EdgePushBack=0
; The pointer stays where it is on screen while you move the camera with the keyboard
; (needs ScreenSpaceCursor=1)
HoldPointerWhilePanning=1
; Pointer movement without the game's smoothing and minimum step
DirectResponse=1
; Camera rotation in any direction, at the same speed sideways and up or down
DirectCamera=1
; The camera moves to the pointer while you rotate it, as in the original
RecenterWhileRotating=0
; The camera moves to the pointer when it is outside the playing field, as in the original
FollowPointerOffField=0
; Pull the cursor towards objects, as for gamepads
SnapToObjects=0
; The cursor is not slowed by slopes, water or lava (only matters with ScreenSpaceCursor=0)
IgnoreTerrainSlope=1
; No jump when the cursor reaches the edge of the screen (only matters with EdgePushBack=1)
SmoothEdgeScroll=1
; The following only matter with NormalCursor=0:
;   BreathLag   the worm follows the cursor with a delay
;   BreathIdle  the worm keeps moving while the mouse is still (0 also stops its animation)
BreathLag=1
BreathIdle=1

[Sandbox]
; Play the story and challenge maps without goals, villagers and totems, with all powers and natural
; events. Story progress and challenge results are not changed.
; Press F3 in the main menu, then choose a map in Challenges. F3 again for the challenges.
; In a map:
;   1 to = switch powers on        number pad 1 to 7 start natural events, 0 stops them
;   Shift and X use sand, lava, water and plants (tap or hold)
;   F4 hides or shows the panel with the keys
Sandbox=1
; Unlock the developers' world editor. Press ToggleKey (or Select on a gamepad) in a level.
; In the editor the number pad acts as a gamepad (Num Lock on):
;   8 2 4 6 = D-pad, 5 = A, 0 = B, . = X, + = Y, 7 = LB, 9 = RB, * = Start
DevSandbox=1
; One key, with the same names as SkipKeys
ToggleKey=F2

[Editor]
; Make every story map and challenge available in the menus. Your progress is not changed
UnlockMaps=0
; Number pad keys change the world at the cursor, on any map (experimental):
;   1 big mountain   2 small mountain   3 crater
;   4 lava source    5 volcano          6 remove volcano or lava source
;   7 water source   8 remove water     9 tree
;   0 remove tree    . tsunami          * tides    / caldera    + - vegetation
EditorKeys=0
; Allow more of each when using these keys
RaiseLimits=1

[General]
; Start without Ubisoft Connect.
;   1 = if this PC has saved games that work offline (Documents/Dust/profiles)
;   2 = always. If your saved games are only online, the game warns that you start from the beginning
;   0 = never
Offline=1
; On processors with fast and slow cores, use only the fast ones (if there are at least four)
PerformanceCores=1
; Run the simulation's threads at normal priority instead of below normal
WorkerPriority=1
; Write FromDust.SkoFix.log
Log=1
; Add a summary to the log every ten seconds. F10 shows or hides the pointer, F11 switches between
; 30 and 60 frames per second
Diagnostics=0
; When the game freezes for 8 seconds, save FromDust.SkoFix-hang1.dmp (up to three). These files can
; contain your Windows user name
HangDump=0
